<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTTP 协议闯关 · WorkShop 实战</title>
<style>
  :root{
    --bg:#060912; --panel:#0d1426; --panel2:#111b33;
    --ink:#e8eefc; --muted:#8aa0c8;
    --cyan:#22d3ee; --pink:#f472b6; --gold:#fbbf24; --green:#34d399; --red:#fb7185;
    --line:rgba(120,160,255,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(34,211,238,.20), transparent 60%),
      radial-gradient(820px 520px at 92% 4%, rgba(244,114,182,.18), transparent 60%),
      radial-gradient(700px 600px at 50% 120%, rgba(123,97,255,.16), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    min-height:100vh; padding:28px 20px;
  }
  .wrap{max-width:1120px;margin:0 auto}
  .hero{text-align:center;margin-bottom:22px}
  .hero h1{
    margin:0;font-size:46px;font-weight:800;letter-spacing:6px;
    background:linear-gradient(92deg,var(--cyan),#a5f3fc 30%,var(--pink) 70%,var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 26px rgba(34,211,238,.25);
    animation:hue 6s linear infinite;
  }
  @keyframes hue{to{filter:hue-rotate(22deg)}}
  .hero p{margin:8px 0 0;color:var(--muted);letter-spacing:1px}
  .hero .tagline{
    display:inline-block;margin-top:10px;padding:5px 16px;border:1px solid var(--line);
    border-radius:999px;font-size:12px;color:var(--cyan);
    box-shadow:0 0 18px rgba(34,211,238,.18) inset;
  }

  /* 流光进度条 */
  .bar{height:8px;border-radius:999px;background:var(--panel2);overflow:hidden;margin:18px 0 22px;
    border:1px solid var(--line)}
  .bar>i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--pink));
    box-shadow:0 0 16px var(--cyan);transition:width .5s ease;position:relative}
  .bar>i::after{content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    transform:translateX(-100%);animation:scan 1.6s linear infinite}
  @keyframes scan{to{transform:translateX(100%)}}

  .progress{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
  .lv{flex:1;min-width:150px;position:relative;padding:14px 12px 12px;border-radius:14px;
    background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);cursor:pointer;overflow:hidden;
    transition:transform .15s,box-shadow .2s,border-color .2s}
  .lv::before{content:"";position:absolute;inset:0;opacity:0;
    background:linear-gradient(120deg,transparent,rgba(34,211,238,.16),transparent);
    transition:opacity .2s}
  .lv:hover{transform:translateY(-4px);border-color:var(--cyan);
    box-shadow:0 10px 30px rgba(34,211,238,.20)}
  .lv:hover::before{opacity:1}
  .lv .no{font-size:12px;letter-spacing:3px;color:var(--cyan);font-weight:700}
  .lv .nm{font-size:14px;margin-top:4px;font-weight:600}
  .lv.active{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 12px 34px rgba(244,114,182,.30)}
  .lv.done .no{color:var(--green)}
  .lv.done::after{content:"✔ 已通";position:absolute;top:8px;right:10px;font-size:11px;color:var(--green)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.35)}
  .card h3{margin:0 0 12px;font-size:16px;color:var(--ink);
    border-left:3px solid var(--cyan);padding-left:10px}
  .card.know{font-size:14px;color:var(--muted)}
  .card.know b{color:var(--ink)}
  .card.know code,.console code{color:var(--cyan);background:rgba(34,211,238,.10);
    padding:1px 6px;border-radius:6px;font-size:12.5px}
  .badge{display:inline-block;padding:2px 10px;border-radius:8px;font-weight:700;font-size:12px;margin:1px 2px}
  .badge.ok{color:var(--green);background:rgba(52,211,153,.14);box-shadow:0 0 12px rgba(52,211,153,.25)}
  .badge.warn{color:var(--gold);background:rgba(251,191,36,.14);box-shadow:0 0 12px rgba(251,191,36,.22)}
  .badge.err{color:var(--red);background:rgba(251,113,133,.14);box-shadow:0 0 12px rgba(251,113,133,.22)}

  .console{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:12.5px}
  .req,.res{white-space:pre-wrap;border-radius:10px;padding:12px;min-height:130px;margin:0;
    background:#04070f;border:1px solid var(--line);overflow:auto}
  .req{color:#7dd3fc}
  .res{color:#86efac}
  .lbl{color:var(--muted);font-size:11px;letter-spacing:2px;margin:12px 0 5px}
  .btn{position:relative;overflow:hidden;margin-top:12px;background:linear-gradient(90deg,var(--cyan),#0ea5b7);
    color:#04121a;border:0;border-radius:10px;padding:11px 20px;font-size:14px;font-weight:700;
    cursor:pointer;letter-spacing:1px;box-shadow:0 0 20px rgba(34,211,238,.35)}
  .btn:hover{box-shadow:0 0 30px rgba(34,211,238,.55)}
  .btn.ghost{background:transparent;color:var(--cyan);border:1px solid var(--cyan);box-shadow:none}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);
    transform:skewX(-20deg);animation:btnscan 2.4s ease-in-out infinite}
  @keyframes btnscan{0%,100%{left:-60%}55%{left:120%}}
  .btn[disabled]{opacity:.6;cursor:wait}
  .field{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
    background:#04070f;color:var(--ink);font-family:inherit;font-size:13px;margin-top:8px}
  .field:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 14px rgba(34,211,238,.3)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:10px;min-height:18px}
  .q button{display:block;width:100%;text-align:left;margin:7px 0;padding:9px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);
    cursor:pointer;font-size:13px;transition:.15s}
  .q button:hover{border-color:var(--cyan)}
  .q button.right{border-color:var(--green);background:rgba(52,211,153,.14)}
  .q button.wrong{border-color:var(--red);background:rgba(251,113,133,.14)}
  .win{text-align:center;padding:14px;border:1px dashed var(--gold);border-radius:14px;
    color:var(--gold);margin-top:14px;letter-spacing:2px;text-shadow:0 0 14px rgba(251,191,36,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>HTTP 协议闯关</h1>
    <p>WORKSHOP 实战 · 像打 BOSS 一样搞懂请求与响应</p>
    <span class="tagline">10 关通关 · 每关对照真实 /api/items 接口 · 必学全收纳</span>
  </div>

  <div class="bar"><i id="barfill"></i></div>
  <div class="progress" id="progress"></div>

  <div class="grid">
    <div class="card know" id="know"></div>
    <div class="card">
      <h3>控制台 · CONSOLE</h3>
      <div class="console">
        <div class="lbl">▶ 你发出的请求报文</div>
        <pre class="req" id="req">（点「演示」看这里）</pre>
        <div class="lbl">◀ 服务器返回的响应报文</div>
        <pre class="res" id="res">（响应会显示在这里）</pre>
      </div>
      <div id="controls"></div>
      <div class="hint" id="hint"></div>
      <div id="win"></div>
    </div>
  </div>
</div>

<script>
const LEVELS = [
  { id:'L1', no:'LV.01', title:'请求·响应 + URL 解剖',
    know:`<b>HTTP 是「请求—响应」协议：</b>客户端发 <b>请求报文</b>，服务器回 <b>响应报文</b>。一次往返 = 一个 HTTP 事务。<br><br>
      <b>拆解一个 URL：</b><br>
      <code>https://ws.xxx/api/items?table=work&amp;week=41#top</code><br>
      • <code>scheme</code> = https（协议）<br>
      • <code>host</code> = ws.xxx（哪台服务器）<br>
      • <code>path</code> = /api/items（哪个资源）<br>
      • <code>query</code> = ?table=work（查询参数）<br>
      • <code>fragment</code> = #top（页内锚点，<b>不发往服务器</b>）<br><br>
      <b>WorkShop：</b>前端本应拼出 <code>/api/items?table=work</code> 去拉数据——但当前前端用本地内存假数据，没真发（所以公网看不到真数据）。`,
    demo:{ req:`GET /api/items?table=work HTTP/1.1
Host: workshop-d4g02a7z81ff51a63.ap-shanghai.app.tcloudbase.com
Accept: application/json`,
      res:`HTTP/1.1 200 OK
Content-Type: application/json

{ "ok": true, "data": [ /* 本周事项 */ ], "error": null }`,
      status:'ok', note:'200 = 成功。{ok,data,error} 是 WorkShop 统一响应形状。' },
    quiz:{ t:'URL 中 ? 之后的部分叫什么？', opts:['路径(path)','查询参数(query)','锚点(fragment)'], ans:1,
      explain:'? 之后是 query 查询参数，用 key=value 传额外条件；# 之后才是 fragment。' } },

  { id:'L2', no:'LV.02', title:'方法全家福 + 幂等',
    know:`<b>常用方法（动词）：</b><br>
      <span class="badge ok">GET</span> 取数据（不应改服务器）<br>
      <span class="badge ok">POST</span> 新建资源<br>
      <span class="badge ok">PUT</span> 完整替换某资源（幂等）<br>
      <span class="badge ok">PATCH</span> 局部修改（幂等）<br>
      <span class="badge ok">DELETE</span> 删除（幂等）<br>
      <span class="badge warn">HEAD</span> 只要响应头、不要 body<br>
      <span class="badge warn">OPTIONS</span> 预检（CORS 跨域先问一声）<br><br>
      <b>幂等</b> = 同一请求发 N 次效果同发 1 次（GET/PUT/DELETE 幂等；POST 不幂等，所以 WorkShop 用 <code>idempotencyKey</code> 给 POST 补幂等）。`,
    demo:{ req:`PUT /api/items/it_123 HTTP/1.1
Content-Type: application/json

{ "title": "改后的标题", "start": "2026-10-06 14:00" }`,
      res:`HTTP/1.1 200 OK
Content-Type: application/json

{ "ok": true, "data": { "id": "it_123", "title": "改后的标题" } }`,
      status:'ok', note:'PUT 完整替换 it_123；发多次结果一致 = 幂等。' },
    quiz:{ t:'哪个方法用于「完整替换资源」且幂等？', opts:['POST','PUT','PATCH 局部改'], ans:1,
      explain:'PUT = 完整替换且幂等；PATCH 才是局部修改。' } },

  { id:'L3', no:'LV.03', title:'状态码百科全书',
    know:`状态码是服务器回的「三位数结论」，分五类：<br>
      <span class="badge ok">1xx</span> 继续（少见）<br>
      <span class="badge ok">2xx</span> 成功（200 拿到 / 201 新建 / 204 无内容）<br>
      <span class="badge warn">3xx</span> 重定向（301 永久 / 302 临时 / 304 未修改）<br>
      <span class="badge warn">4xx</span> 客户端错（400 缺字段 / 401 未登录 / 403 无权限 / 404 没这资源 / 409 冲突 / 422 校验不过 / 429 太频繁）<br>
      <span class="badge err">5xx</span> 服务器炸（500 内部 / 502 网关 / 503 过载 / 504 超时）<br><br>
      <b>WorkShop：</b>缺标题→<span class="badge warn">400</span>；重复提交→<span class="badge warn">409</span>；正常→<span class="badge ok">200/201</span>。`,
    demo:{ req:`GET /api/items/不存在的id HTTP/1.1
Host: workshop.xxx`,
      res:`HTTP/1.1 404 Not Found
Content-Type: application/json

{ "ok": false, "data": null, "error": "item not found" }`,
      status:'warn', note:'404 = 资源不存在，属客户端问题（4xx）。' },
    quiz:{ t:'资源已「永久移动」到新地址，用哪个码？', opts:['301','304','302'], ans:0,
      explain:'301=永久重定向；302=临时；304=缓存未修改，三者别混。' } },

  { id:'L4', no:'LV.04', title:'GET 与查询参数',
    know:`<b>GET</b> 把数据放在 <b>URL 的 query</b> 里（不是 body）。参数明文出现在地址栏，有长度限制，可被收藏/分享。<br><br>
      <code>GET /api/items?table=work&amp;week=2026-W41 HTTP/1.1</code><br><br>
      多个参数用 <code>&amp;</code> 连接。GET 应只做「读」，不改服务器状态——这也是它能安全刷新、能被浏览器/CDN 缓存的原因。<br><br>
      <b>WorkShop：</b>时间线按 <code>table=work/personal</code> 切换工作/个人视图，就是 GET 查询参数。`,
    demo:{ req:`GET /api/items?table=personal&week=2026-W41 HTTP/1.1
Host: workshop.xxx
Accept: application/json`,
      res:`HTTP/1.1 200 OK
Content-Type: application/json

{ "ok": true, "data": [ /* 个人视图事项 */ ] }`,
      status:'ok', note:'GET 参数在 URL：table=personal 切到个人视图。' },
    quiz:{ t:'GET 请求的数据通常放在哪？', opts:['请求 body','URL 查询参数','响应头'], ans:1,
      explain:'GET 数据在 URL query；放 body 不符合语义且多数服务器忽略。' } },

  { id:'L5', no:'LV.05', title:'POST 与 Body + 409',
    know:`<b>POST</b> 把数据放在 <b>body</b>（不在 URL），适合提交较大/敏感内容。body 格式由 <code>Content-Type</code> 声明。<br><br>
      <code>POST /api/items</code> + <code>Content-Type: application/json</code> + JSON body = 新建一条事项。<br>
      回 <span class="badge ok">201 Created</span>；若 <code>idempotencyKey</code> 已存在回 <span class="badge warn">409 Conflict</span> 防重复。<br><br>
      <b>WorkShop：</b>新建会议/行程就走这条。body 含 title/start/end/type/table。`,
    demo:{ req:`POST /api/items HTTP/1.1
Content-Type: application/json

{
  "title": "部门周会",
  "start": "2026-10-06 14:00",
  "end":   "2026-10-06 15:00",
  "type":  "meeting",
  "table": "work",
  "idempotencyKey": "demo-001"
}`,
      res:`HTTP/1.1 201 Created
Content-Type: application/json

{ "ok": true, "data": { "id": "it_xxx", "title": "部门周会" }, "error": null }`,
      status:'ok', note:'201 = 新建成功。带 idempotencyKey 防重。' },
    dupDemo:{ req:`POST /api/items HTTP/1.1
Content-Type: application/json

{ "title": "部门周会", "idempotencyKey": "demo-001" }`,
      res:`HTTP/1.1 409 Conflict
Content-Type: application/json

{ "ok": false, "data": null, "error": "请勿重复提交（idempotencyKey 已存在）" }`,
      note:'409 = 冲突。服务器用 idempotencyKey 拦住重复写入，保护数据。' },
    dupLabel:'↻ 演示 409 冲突',
    quiz:{ t:'POST 提交 JSON 时，Content-Type 应填？', opts:['application/json','text/plain','multipart/form-data（仅文件）'], ans:0,
      explain:'JSON body 配 application/json；表单用 x-www-form-urlencoded 或 multipart。' } },

  { id:'L6', no:'LV.06', title:'Header 全解',
    know:`<b>Header</b> = 元数据，告诉对方「怎么理解这条消息」。请求头/响应头结构相同：<code>Key: Value</code>。<br><br>
      常用请求头：<br>
      • <code>Content-Type</code>：body 格式<br>
      • <code>Authorization</code>：身份凭证（Bearer token）<br>
      • <code>Accept</code>：客户端想要什么格式<br>
      • <code>Cookie</code>：带上的会话标识<br>
      常用响应头：<br>
      • <code>Content-Type</code> / <code>Content-Length</code><br>
      • <code>Cache-Control</code> / <code>ETag</code>（缓存）<br>
      • <code>Set-Cookie</code>：让浏览器存会话<br><br>
      <b>WorkShop：</b><code>db.js</code> 里 <code>getBearer()</code> 用 API_KEY 换 token，再塞进 Authorization 头连 PostgREST 网关。`,
    demo:{ req:`POST /api/items HTTP/1.1
Host: workshop.xxx
Content-Type: application/json
Authorization: Bearer <token 由 API_KEY 换取>
Accept: application/json
Cookie: session=abc

{ "title": "..." }`,
      res:`HTTP/1.1 201 Created
Content-Type: application/json
Cache-Control: no-store
Set-Cookie: session=abc; HttpOnly

{ "ok": true, "data": { ... } }`,
      status:'ok', note:'没有正确 Authorization，网关回 401/403——数据安全第一道门。' },
    quiz:{ t:'携带「身份凭证 / token」应放进哪个头？', opts:['Content-Type','Authorization','Set-Cookie 是服务器发的'], ans:1,
      explain:'Authorization: Bearer <token> 是标准身份头；Cookie 由浏览器自动带、服务器用 Set-Cookie 种下。' } },

  { id:'L7', no:'LV.07', title:'无状态 & 鉴权',
    know:`<b>HTTP 本身「无状态」</b>：每个请求独立，服务器不记得你是谁。要维持登录，得每次自己带上身份凭证。<br><br>
      三种常见方案：<br>
      ① <b>Cookie + Session</b>：服务器存会话，浏览器自动带 Cookie<br>
      ② <b>Token（JWT/Bearer）</b>：登录后发签名令牌，之后每次 Authorization 头带上<br>
      ③ <b>OAuth</b>：第三方授权（如用微信登录）<br><br>
      <b>WorkShop：</b>后端 <code>getBearer()</code> 拿 API_KEY 换 Bearer token → 放进 Authorization 头 → 才能操作数据库。这就是「无状态 + Token 鉴权」。`,
    demo:{ req:`GET /api/items?table=work HTTP/1.1
Authorization: Bearer eyJhbGciOi...（签名令牌）`,
      res:`HTTP/1.1 200 OK
Content-Type: application/json

{ "ok": true, "data": [ ... ] }`,
      status:'ok', note:'带上有效 Bearer 才能通过鉴权，拿到数据。' },
    quiz:{ t:'HTTP 无状态，靠什么维持「已登录」？', opts:['每次请求重发账号密码','Cookie/Session/Token 凭证','HTTP 天生能记住'], ans:1,
      explain:'靠每次请求带上凭证（Cookie 或 Token）让服务器识别身份。' } },

  { id:'L8', no:'LV.08', title:'缓存 Cache',
    know:`<b>缓存</b> 让重复请求省流量、提速。靠响应头协商：<br><br>
      • <code>Cache-Control: max-age=60</code>：60 秒内直接用本地副本<br>
      • <code>ETag: "abc"</code>：资源版本指纹<br>
      • 客户端再请求带 <code>If-None-Match: "abc"</code><br>
      • 服务器比对：没变 → 回 <span class="badge warn">304 Not Modified</span>（不传 body，浏览器用缓存）<br><br>
      <b>WorkShop 联想：</b>时间线数据加缓存，刷新不必每次打数据库——但写操作通常 <code>Cache-Control: no-store</code> 防「改了没刷新」。`,
    demo:{ req:`GET /api/items?table=work HTTP/1.1
If-None-Match: "v-2026W41"`,
      res:`HTTP/1.1 304 Not Modified
ETag: "v-2026W41"
Cache-Control: max-age=60`,
      status:'warn', note:'304 = 资源没变，浏览器用本地缓存，省一次完整传输。' },
    quiz:{ t:'服务器回 304 通常配合哪个请求头做验证？', opts:['If-None-Match / ETag','Content-Length','Set-Cookie'], ans:0,
      explain:'ETag + If-None-Match 配对做缓存验证；一致就回 304。' } },

  { id:'L9', no:'LV.09', title:'HTTPS 与版本演进',
    know:`<b>HTTPS = HTTP + TLS 加密层</b>：防窃听、防篡改、防冒充。公网接口必须用 https。<br><br>
      <b>版本演进：</b><br>
      • <span class="badge ok">HTTP/1.0</span> 每请求建一次连接（慢）<br>
      • <span class="badge ok">HTTP/1.1</span> 默认 keep-alive 持久连接（当前主流）<br>
      • <span class="badge ok">HTTP/2</span> 多路复用、头部压缩（一连接并发多请求）<br>
      • <span class="badge ok">HTTP/3</span> 基于 QUIC（UDP），弱网下更快<br><br>
      <b>WorkShop：</b>云函数地址就是 <code>https://...app.tcloudbase.com</code>——已走在加密通道上。`,
    demo:{ req:`GET https://workshop.xxx/api/items HTTP/2
Host: workshop.xxx`,
      res:`HTTP/2 200 OK
Content-Type: application/json

{ "ok": true, "data": [ ... ] }`,
      status:'ok', note:'HTTP/2 多路复用，多个请求共用一条连接。' },
    quiz:{ t:'HTTPS 相比 HTTP 多了一层什么？', opts:['压缩','TLS 加密','缓存'], ans:1,
      explain:'HTTPS 在 HTTP 之上加 TLS，提供加密 / 完整性 / 身份认证。' } },

  { id:'L10', no:'LV.10', title:'实战关 · 真打接口',
    know:`前面都是<b>模拟响应</b>（离线可玩）。这关真打已上线接口：<br><br>
      ① 填你的云函数地址（Day 19 你验证过的 <code>/api/items</code>）<br>
      ② 点发送，浏览器真发 HTTP GET、拿真实 JSON<br><br>
      <b>注意：</b>浏览器「同源策略」——此页与接口不同域会被拦（CORS）。把本页也部署到 CloudBase 同域，或接口开 CORS 即可真通。`,
    real:true }
];

let cur=0; const done=new Set();
const progress=document.getElementById('progress');
LEVELS.forEach((lv,i)=>{
  const d=document.createElement('div'); d.className='lv'; d.id='lv'+i;
  d.innerHTML='<div class="no">'+lv.no+'</div><div class="nm">'+lv.title+'</div>';
  d.onclick=()=>go(i); progress.appendChild(d);
});
function updateBar(){document.getElementById('barfill').style.width=(done.size/LEVELS.length*100)+'%';}
function go(i){
  cur=i; LEVELS.forEach((_,k)=>{
    const el=document.getElementById('lv'+k);
    el.classList.toggle('active',k===i);
    el.classList.toggle('done',done.has(k)&&k!==i);
  });
  const lv=LEVELS[i];
  document.getElementById('know').innerHTML=lv.know;
  document.getElementById('req').textContent='（点「演示」看这里）';
  document.getElementById('res').textContent='（响应会显示在这里）';
  document.getElementById('hint').textContent='';
  document.getElementById('win').innerHTML='';
  document.getElementById('controls').innerHTML=buildControls(lv);
  if(lv.quiz) renderQuiz();
}
function buildControls(lv){
  let h='';
  if(lv.demo) h+='<button class="btn" onclick="send()">▶ 演示报文</button>';
  if(lv.dupDemo) h+='<button class="btn ghost" onclick="sendDup()">'+ (lv.dupLabel||'↻ 再演示一次（看冲突）') +'</button>';
  if(lv.quiz) h+='<div class="q" id="quiz"></div>';
  if(lv.real) h+='<input class="field" id="realUrl" placeholder="https://你的/api/items?table=work"><button class="btn" onclick="sendReal()">⚡ 真实发送 GET</button>';
  return h;
}
function markDone(){done.add(cur);document.getElementById('lv'+cur).classList.add('done');updateBar();
  if(done.size===LEVELS.length)document.getElementById('win').innerHTML='<div class="win">★ 全部通关 · 你已掌握 HTTP 必学核心 ★</div>';}
function busy(btn){btn.disabled=true;btn.textContent='请求中…';return btn;}
function send(){
  const b=event&&event.target; if(b)busy(b);
  const d=LEVELS[cur].demo;
  setTimeout(()=>{
    document.getElementById('req').textContent=d.req;
    document.getElementById('res').textContent=d.res;
    document.getElementById('hint').innerHTML='<span class="badge '+d.status+'">'+(d.status==='ok'?'成功':d.status==='warn'?'注意':'错误')+'</span> '+d.note;
    if(b){b.disabled=false;b.innerHTML='▶ 演示报文';}
    markDone();
  },420);
}
function sendDup(){
  const b=event&&event.target; if(b)busy(b);
  const lv=LEVELS[cur]; const d=lv.dupDemo||{};
  setTimeout(()=>{
    document.getElementById('req').textContent=d.req||'（同 POST 请求）';
    document.getElementById('res').textContent=d.res||'HTTP/1.1 409 Conflict\n\n{ "ok":false, "error":"冲突" }';
    document.getElementById('hint').innerHTML='<span class="badge warn">409</span> '+(d.note||'冲突');
    if(b){b.disabled=false;b.innerHTML=lv.dupLabel||'↻ 再演示一次（看冲突）';}
    markDone();
  },420);
}
function sendReal(){
  const url=document.getElementById('realUrl').value.trim();
  if(!url){document.getElementById('hint').textContent='先填接口地址。';return;}
  const b=event.target; busy(b);
  document.getElementById('req').textContent='GET '+url+'\nHost: '+new URL(url).host+'\nAccept: application/json';
  document.getElementById('res').textContent='（请求发送中…）';
  fetch(url).then(r=>r.text().then(t=>({s:r.status,ok:r.ok,t})))
    .then(({s,ok,t})=>{
      document.getElementById('res').textContent='HTTP/1.1 '+s+'\n\n'+t;
      document.getElementById('hint').innerHTML='<span class="badge '+(ok?'ok':'err')+'">'+s+'</span> 真实响应已返回。';
      b.disabled=false;b.innerHTML='⚡ 真实发送 GET';markDone();
    }).catch(e=>{
      document.getElementById('res').textContent='请求失败：'+e.message;
      document.getElementById('hint').innerHTML='<span class="badge err">CORS/网络</span> 多半跨域被浏览器拦——把本页部署到同域或开 CORS 即可。';
      b.disabled=false;b.innerHTML='⚡ 真实发送 GET';
    });
}
function renderQuiz(){
  const box=document.getElementById('quiz'); const q=LEVELS[cur].quiz;
  box.innerHTML='<div style="font-size:13px;margin-bottom:4px"><b>Q.</b> '+q.t+'</div>'+
    q.opts.map((o,i)=>'<button onclick="answer('+i+','+q.ans+',this)">'+o+'</button>').join('');
}
function answer(i,ans,el){
  const btns=el.parentElement.querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  const q=LEVELS[cur].quiz;
  if(i===ans){el.classList.add('right');
    document.getElementById('hint').innerHTML='<span class="badge ok">答对</span> '+q.explain;markDone();
  }else{el.classList.add('wrong');btns[ans].classList.add('right');
    document.getElementById('hint').innerHTML='<span class="badge err">再想想</span> '+q.explain;}
}
updateBar(); go(0);
</script>
</body>
</html>
